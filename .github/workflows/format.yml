name: Format Files
run-name: Format files using Oxfmt, Ruff, and fmt-maven-plugin
on:
  push:
    branches:
      - main

permissions: {}

jobs:
  format:
    name: Format Files
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup github-actions[bot] git config
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d
        with:
          enable-cache: false

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup pnpm
        uses: pnpm/setup@bf5bfae7d43e2b2b1191383f5005cd3fb69b848d # v2.0.2
        with:
          runtime: node@22
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Format files
        run: pnpm format

      - name: Check for changes
        id: changes
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "changes_exist=false" >> "$GITHUB_OUTPUT"
            exit 0
          else
            echo "changes_exist=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit formatting changes via GitHub Actions, if changes exist
        if: steps.changes.outputs.changes_exist == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |-
          git commit -m "chore: format files via github actions"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
