  - follow-redirects@1.15.12
  - dompurify@3.3.4 || 3.4.0 || 3.4.9 || 3.4.11
  - axios@1.15.0 || 1.15.1 || 1.15.2 || 1.16.0
  - postcss@8.5.10
  - '@clerk/shared@3.47.4 || 3.47.5'
  - '@clerk/nextjs@6.39.2 || 6.39.3'
  - protobufjs@7.5.5 || 7.5.6 || 7.5.8 || 7.6.3
