[project]
name = "rating"
version = "0.1.0"
description = "A rating microservice for a fake e-commerce website."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "django",
  "django-cors-headers",
  "django-environ",
  "django-extensions",
  "django-ninja",
  "psycopg2-binary",
  "requests",
  "pydantic",
  "gunicorn>=23.0.0",
  "pyjwt>=2.8.0",
  "cryptography>=42.0.0",
]

[dependency-groups]
dev = ["poethepoet>=0.38.0", "pyrefly>=0.55.0", "ruff>=0.14.8", "ty>=0.0.20"]

[tool.poe.tasks]
start = "uv run gunicorn rating.wsgi --bind 0.0.0.0:8001 --workers 4"
dev = "uv run python manage.py runserver 8001 --settings=rating.settings --traceback"
venv-create = "uv venv"
venv-activate = "source .venv/bin/activate"
sync = "uv sync"
typecheck = "pyrefly check"
update = "uv lock --upgrade"
format = "ruff format ."
lint = "ruff check --fix ."
migrate = "uv run manage.py migrate"
create-migrations = "uv run manage.py makemigrations"
reset-db = "sh -c 'uv run manage.py flush --noinput && uv run manage.py migrate'"

[tool.pyrefly]
preset = "basic"

[tool.ty.environment]
python = ".venv"

[tool.ty.src]
include = ["**/*.py"]

[tool.ruff]
line-length = 120
fix = true

[tool.ruff.lint]
select = [
  # pycodestyle
  "E",
  # Pyflakes
  "F",
  # pyupgrade
  "UP",
  # flake8-bugbear
  "B",
  # flake8-simplify
  "SIM",
  # isort
  "I",
]
ignore = ["E501", "W291"]

[tool.ruff.lint.isort]
known-first-party = ["services"]
known-third-party = ["django", "corsheaders", "environ", "extensions", "ninja", "psycopg2", "requests", "pydantic"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "single"
line-ending = "lf"
skip-magic-trailing-comma = false
