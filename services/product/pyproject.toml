[project]
name = "product"
version = "0.1.0"
description = "A product microservice for a fake e-commerce website."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "brotli-asgi>=1.4.0",
  "dotenv>=0.9.9",
  "fastapi>=0.116.1",
  "google-genai>=1.25.0",
  "httpx>=0.28.1",
  "loguru>=0.7.3",
  "psycopg2-binary>=2.9.11",
  "sqlmodel>=0.0.24",
  "uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.36.1",
    "poethepoet>=0.38.0",
    "ruff>=0.14.8",
]

[tool.poe.tasks]
start = "uvicorn app:app"
dev = "uvicorn app:app --reload"
venv-create = "uv venv"
venv-activate = "source .venv/bin/activate"
sync = "uv sync"
typecheck = "basedpyright ."
update = "uv lock --upgrade"
format = "ruff format ."
lint = "ruff check --fix ."
init-db = "uv run database.py"
seed = "uv run seed.py"

[tool.ruff]
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]
ignore = ["E501", "W291"]

[tool.ruff.lint.isort]
known-first-party = ["services"]
known-third-party = ["sqlmodel", "pydantic", "dotenv", "google_genai", "loguru", "uvicorn"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "single"
line-ending = "lf"
skip-magic-trailing-comma = false
