[project]
name = "order"
version = "0.1.0"
description = "An order microservice for a fake e-commerce website."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "flask>=3.1.2",
  "flask-cors>=6.0.1",
  "psycopg2-binary>=2.9.11",
  "pydantic>=2.12.5",
  "python-dotenv>=1.2.1",
  "sqlmodel>=0.0.27",
  "loguru>=0.7.3",
  "flask-compress>=1.23",
]

[dependency-groups]
dev = [
    "poethepoet>=0.38.0",
    "ruff>=0.14.8",
]

[tool.poe.tasks]
start = "gunicorn -w 4 'app:create_app()"
dev = "flask run --debug"
venv-create = "uv venv"
venv-activate = "source .venv/bin/activate"
sync = "uv sync"
update = "uv lock --upgrade"
typecheck = "basedpyright ."
format = "ruff format ."
lint = "ruff check --fix ."
init-db = "uv run database.py"

[tool.ruff]
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]
ignore = ["E501", "W291", "UP017"]

[tool.ruff.lint.isort]
known-first-party = ["services"]
known-third-party = ["flask", "flask_compress", "flask_cors", "loguru", "psycopg2", "pydantic", "sqlmodel"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "single"
line-ending = "lf"
skip-magic-trailing-comma = false
