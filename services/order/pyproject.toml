[project]
name = "order"
version = "0.1.0"
description = "Order microservice for a fake e-commerce website."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "backports-datetime-fromisoformat==2.0.3",
  "blinker==1.9.0",
  "click==8.2.1",
  "flask==3.1.1",
  "flask-admin==1.6.1",
  "flask-cors>=6.0.1",
  "flask-marshmallow==1.3.0",
  "flask-sqlalchemy==3.1.1",
  "greenlet==3.2.2",
  "gunicorn>=23.0.0",
  "itsdangerous==2.2.0",
  "jinja2==3.1.6",
  "markupsafe==3.0.2",
  "marshmallow==4.0.0",
  "marshmallow-sqlalchemy==1.4.2",
  "psycopg2>=2.9.10",
  "pydantic>=2.11.7",
  "python-dotenv==1.1.0",
  "ruff>=0.12.2",
  "sqlalchemy>=2.0.41",
  "sqlmodel>=0.0.24",
  "typing-extensions==4.13.2",
  "werkzeug==3.1.3",
  "wtforms==3.2.1",
]

[tool.ruff]
line-length = 80

[tool.ruff.format]
docstring-code-format = true
quote-style = "single"
line-ending = "lf"
skip-magic-trailing-comma = false
