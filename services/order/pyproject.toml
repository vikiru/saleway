[project]
name = "order"
version = "0.1.0"
description = "Order microservice for a fake e-commerce website."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "backports-datetime-fromisoformat==2.0.3",
  "blinker==1.9.0",
  "click>=8.3.1",
  "flask>=3.1.2",
  "flask-admin>=2.0.2",
  "flask-cors>=6.0.1",
  "flask-marshmallow==1.3.0",
  "flask-sqlalchemy==3.1.1",
  "greenlet==3.2.2",
  "gunicorn>=23.0.0",
  "itsdangerous==2.2.0",
  "jinja2==3.1.6",
  "markupsafe>=3.0.3",
  "marshmallow>=4.1.1",
  "marshmallow-sqlalchemy==1.4.2",
  "psycopg2>=2.9.11",
  "pydantic>=2.12.5",
  "python-dotenv>=1.2.1",
  "ruff>=0.14.8",
  "sqlalchemy>=2.0.44",
  "sqlmodel>=0.0.27",
  "typing-extensions>=4.15.0",
  "werkzeug>=3.1.4",
  "wtforms==3.2.1",
]

[tool.ruff]
line-length = 80

[tool.ruff.format]
docstring-code-format = true
quote-style = "single"
line-ending = "lf"
skip-magic-trailing-comma = false
