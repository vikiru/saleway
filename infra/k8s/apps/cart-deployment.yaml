apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-service
  namespace: saleway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cart-service
  template:
    metadata:
      labels:
        app: cart-service
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            ['sh', '-c', 'until pg_isready -h postgres -U postgres; do echo waiting for database; sleep 2; done;']
      containers:
        - name: cart-service
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            capabilities:
              drop: ['ALL']
          image: saleway-cart:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: saleway-config
            - secretRef:
                name: saleway-secrets
          env:
            - name: COREPACK_ENABLE_PROJECT_SPEC
              value: "0"
            - name: CART_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: saleway-secrets
                  key: CART_DB_PASSWORD
            - name: DATABASE_URL
              value: postgresql://cart_user:$(CART_DB_PASSWORD)@postgres:5432/cart_db
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests:
              cpu: '100m'
              memory: '128Mi'
            limits:
              cpu: '500m'
              memory: '256Mi'
---
apiVersion: v1
kind: Service
metadata:
  name: cart-service
  namespace: saleway
spec:
  selector:
    app: cart-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
