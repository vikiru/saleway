apiVersion: apps/v1
kind: Deployment
metadata:
  name: rating-service
  namespace: saleway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rating-service
  template:
    metadata:
      labels:
        app: rating-service
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            ['sh', '-c', 'until pg_isready -h postgres -U postgres; do echo waiting for database; sleep 2; done;']
      containers:
        - name: rating-service
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            capabilities:
              drop: ['ALL']
          image: saleway-rating:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: saleway-config
            - secretRef:
                name: saleway-secrets
          env:
            - name: HOME
              value: /tmp
            - name: RATING_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: saleway-secrets
                  key: RATING_DB_PASSWORD
            - name: DATABASE_URL
              value: postgresql://rating_user:$(RATING_DB_PASSWORD)@postgres:5432/rating_db
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8001
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8001
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests:
              cpu: '100m'
              memory: '128Mi'
            limits:
              cpu: '500m'
              memory: '256Mi'
---
apiVersion: v1
kind: Service
metadata:
  name: rating-service
  namespace: saleway
spec:
  selector:
    app: rating-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8001
