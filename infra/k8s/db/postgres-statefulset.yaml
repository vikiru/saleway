# Headless Service for StatefulSet network identity
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: saleway
  labels:
    app: postgres
spec:
  ports:
    - port: 5432
      name: postgres
  clusterIP: None
  selector:
    app: postgres
---
# Standard Service for other pods to connect to
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: saleway
  labels:
    app: postgres
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: saleway
spec:
  serviceName: 'postgres-headless'
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: 'postgres'
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: saleway-secrets
                  key: POSTGRES_ADMIN_PASSWORD
            - name: POSTGRES_DB
              value: 'postgres'
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d/init.sh
              subPath: init.sh
          # Liveness probe to ensure DB is running
          livenessProbe:
            exec:
              command: ['pg_isready', '-U', 'postgres']
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          # Readiness probe to ensure DB can accept connections
          readinessProbe:
            exec:
              command: ['pg_isready', '-U', 'postgres']
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              cpu: '1'
              memory: '512Mi'
            requests:
              cpu: '250m'
              memory: '256Mi'
      volumes:
        - name: postgres-init
          configMap:
            name: postgres-init-script
            defaultMode: 0755
  # This creates a PersistentVolumeClaim for each replica
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: 5Gi
