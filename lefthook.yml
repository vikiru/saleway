commit-msg:
  jobs:
    - name: Validate commit message with commitlint
      run: pnpm exec commitlint --edit $1

pre-commit:
  parallel: false
  jobs:
    - name: Format staged TypeScript and frontend files with oxfmt
      glob: '*.{js,mjs,cjs,ts,jsx,tsx,json,css}'
      run: pnpm oxfmt --write {staged_files}
      stage_fixed: true

    - name: Format staged Python files with ruff
      glob: 'services/**/*.py'
      run: uvx ruff format {staged_files}
      stage_fixed: true

    - name: Lint staged TypeScript files with oxlint
      glob: '*.{js,mjs,cjs,ts,jsx,tsx}'
      run: pnpm oxlint {staged_files}

    - name: Lint staged Python files with ruff
      glob: 'services/**/*.py'
      run: uvx ruff check {staged_files}

    - name: Lint Java payment service
      glob: 'services/payment/**/*.java'
      run: pnpm lint:java

pre-push:
  parallel: false
  jobs:
    - name: TypeScript verification
      glob: '{frontend,services/cart}/**/*.{ts,tsx}'
      run: pnpm typecheck

    - name: Python services typecheck
      glob: 'services/{order,product,rating,user}/**/*.py'
      run: cd services/order && uv run pyrefly check && cd ../product && uv run pyrefly check && cd ../rating && uv run pyrefly check && cd ../user && uv run pyrefly check

    - name: Java payment service typecheck
      glob: 'services/payment/**/*.java'
      run: cd services/payment && mvn test-compile
